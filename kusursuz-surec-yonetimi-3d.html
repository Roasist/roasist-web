<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kusursuz Süreç Yönetimi — 3D Çevik Sprint & İvme Mimarisi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=latin,latin-ext" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #060609;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .process-stage {
      position: relative;
      width: min(100%, 1280px);
      aspect-ratio: 562 / 434;
      max-height: calc(100vh - 48px);
      background-color: #09090D;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 32px 80px -20px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      isolation: isolate;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="process-stage" id="stage">
    <canvas id="processCanvas" aria-label="Kusursuz süreç yönetimi 3 boyutlu çevik sprint ve gerçek zamanlı ivme animasyonu"></canvas>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('processCanvas');
      const stage = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });

      let width = 1020;
      let height = 788;
      let dpr = 1;

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(320, Math.floor(rect.width));
        height = Math.max(240, Math.floor(rect.height));
        canvas.width = width * dpr;
        canvas.height = height * dpr;
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function springEase(t) {
        const c = Math.max(0, Math.min(1, t));
        return 1 - Math.pow(1 - c, 3) * Math.cos(c * Math.PI * 0.65);
      }

      // ============================================================================
      // 3D CAMERA & HOMOGRAPHY ENGINE
      // ============================================================================
      const cam = {
        cx: 510,
        cy: 394,
        fov: 1200,
        rotX: -0.23,
        rotY: -0.16,
        rotZ: 0.025
      };

      function project3D(x, y, z) {
        const cosZ = Math.cos(cam.rotZ), sinZ = Math.sin(cam.rotZ);
        const x1 = x * cosZ - y * sinZ;
        const y1 = x * sinZ + y * cosZ;
        const z1 = z;

        const cosX = Math.cos(cam.rotX), sinX = Math.sin(cam.rotX);
        const y2 = y1 * cosX - z1 * sinX;
        const z2 = y1 * sinX + z1 * cosX;
        const x2 = x1;

        const cosY = Math.cos(cam.rotY), sinY = Math.sin(cam.rotY);
        const x3 = x2 * cosY + z2 * sinY;
        const z3 = -x2 * sinY + z2 * cosY;
        const y3 = y2;

        const scale = cam.fov / Math.max(260, cam.fov - z3);
        return {
          x: cam.cx + x3 * scale,
          y: cam.cy + y3 * scale,
          z: z3,
          scale
        };
      }

      function applyPlaneTransform(c, zPlane, offsetX = 0, offsetY = 0) {
        const p0 = project3D(offsetX, offsetY, zPlane);
        const px = project3D(offsetX + 100, offsetY, zPlane);
        const py = project3D(offsetX, offsetY + 100, zPlane);

        const a = (px.x - p0.x) / 100;
        const b = (px.y - p0.y) / 100;
        const cMat = (py.x - p0.x) / 100;
        const d = (py.y - p0.y) / 100;

        c.transform(a, b, cMat, d, p0.x, p0.y);
      }

      function roundRectPath(c, x, y, w, h, r) {
        c.beginPath();
        c.roundRect(x, y, w, h, r);
      }

      function drawExtrudedSlab(c, x, y, w, h, zTop, thickness, radius, topFill, sideFill, borderStroke, lineWidth = 1.2) {
        c.save();
        applyPlaneTransform(c, zTop - thickness);
        roundRectPath(c, x, y, w, h, radius);
        c.fillStyle = sideFill;
        c.fill();
        c.restore();

        c.save();
        applyPlaneTransform(c, zTop);
        roundRectPath(c, x, y, w, h, radius);
        c.fillStyle = topFill;
        c.fill();
        if (borderStroke) {
          c.strokeStyle = borderStroke;
          c.lineWidth = lineWidth;
          c.stroke();
        }
        c.restore();
      }

      // ============================================================================
      // 1. STUDIO BACKDROP (CLEAN OBSIDIAN STAGE — NO HUD OVERLAYS)
      // ============================================================================
      function drawStudioBackdrop(c) {
        c.fillStyle = '#09090D';
        c.fillRect(0, 0, 1020, 788);

        const glow = c.createRadialGradient(510, 394, 20, 510, 394, 520);
        glow.addColorStop(0, 'rgba(30, 41, 59, 0.36)');
        glow.addColorStop(0.55, 'rgba(15, 23, 42, 0.14)');
        glow.addColorStop(1, 'rgba(9, 9, 13, 0)');
        c.fillStyle = glow;
        c.fillRect(0, 0, 1020, 788);
      }

      // ============================================================================
      // 2. UNDERLYING 3D ENGINEERING GRID PLANE (z = -36)
      // ============================================================================
      function drawBaseEngineeringPlane(c, zBase, liftFactor) {
        if (liftFactor <= 0.02) return;
        const W = 700;
        const H = 452;
        const hw = W / 2;
        const hh = H / 2;

        c.save();
        applyPlaneTransform(c, zBase - 22);
        roundRectPath(c, -hw - 12, -hh - 12, W + 24, H + 24, 24);
        c.fillStyle = 'rgba(0, 0, 0, 0.55)';
        c.shadowColor = 'rgba(0, 0, 0, 0.8)';
        c.shadowBlur = 40;
        c.fill();
        c.restore();

        c.save();
        c.globalAlpha = 0.88 * smoothstep(0, 0.3, liftFactor);
        drawExtrudedSlab(
          c, -hw, -hh, W, H, zBase, 5, 18,
          '#0E1118', '#07080C', 'rgba(148, 163, 184, 0.20)', 1.2
        );

        applyPlaneTransform(c, zBase + 0.5);
        roundRectPath(c, -hw, -hh, W, H, 18);
        c.clip();

        c.strokeStyle = 'rgba(148, 163, 184, 0.07)';
        c.lineWidth = 1;
        for (let gx = -hw + 38; gx < hw; gx += 38) {
          c.beginPath();
          c.moveTo(gx, -hh);
          c.lineTo(gx, hh);
          c.stroke();
        }
        for (let gy = -hh + 38; gy < hh; gy += 38) {
          c.beginPath();
          c.moveTo(-hw, gy);
          c.lineTo(hw, gy);
          c.stroke();
        }
        c.restore();

        const corners = [
          [-hw + 22, -hh + 22],
          [hw - 22, -hh + 22],
          [hw - 22, hh - 22],
          [-hw + 22, hh - 22]
        ];
        c.save();
        c.strokeStyle = `rgba(148, 163, 184, ${0.24 * liftFactor})`;
        c.lineWidth = 1.1;
        c.setLineDash([3, 4]);
        for (const [cx, cy] of corners) {
          const pA = project3D(cx, cy, zBase);
          const pB = project3D(cx, cy, 0);
          c.beginPath();
          c.moveTo(pA.x, pA.y);
          c.lineTo(pB.x, pB.y);
          c.stroke();
        }
        c.setLineDash([]);
        c.restore();
      }

      // ============================================================================
      // 3. MAIN 3D PORCELAIN SPRINT DECK & ELEVATING SPRINT MODULES
      // ============================================================================
      const SPRINT_ROWS = [
        {
          num: '01',
          title: 'Veri & Analitik Kurulumu',
          sub: 'GA4 · Server-Side GTM · CRM',
          barX: -102,
          barW: 162,
          barLabel: 'Veri & Takip Mimarisi',
          metric: '%100',
          startT: 0.02,
          endT: 0.25,
          isPrimary: false
        },
        {
          num: '02',
          title: 'Kreatif & Huni Mimarisi',
          sub: 'Mesaj · Akış · Medya Planı',
          barX: -22,
          barW: 174,
          barLabel: 'Kreatif & Huni Kurulumu',
          metric: '%100',
          startT: 0.22,
          endT: 0.50,
          isPrimary: false
        },
        {
          num: '03',
          title: 'Çevik A/B Test & CRO',
          sub: 'Haftalık Deney & Optimizasyon',
          barX: 66,
          barW: 168,
          barLabel: 'Hızlı A/B Test & CRO',
          metric: '+%38 CVR',
          startT: 0.45,
          endT: 0.76,
          isPrimary: false
        },
        {
          num: '04',
          title: 'Kârlı Ölçeklendirme',
          sub: 'Sürekli Büyüme & ROAS İvmesi',
          barX: 156,
          barW: 172,
          barLabel: 'Sürekli İvme & Ölçek',
          metric: '5.4x ROAS',
          startT: 0.68,
          endT: 0.96,
          isPrimary: true
        }
      ];

      function drawPorcelainSprintDeck(c, timelineProgress, depthLift) {
        const W = 700;
        const H = 452;
        const hw = W / 2; // 350
        const hh = H / 2; // 226

        // Soft shadow cast by porcelain deck onto base layer
        c.save();
        applyPlaneTransform(c, -14 * depthLift - 4);
        roundRectPath(c, -hw + 4, -hh + 8, W, H, 18);
        c.fillStyle = `rgba(2, 6, 23, ${0.42 * depthLift + 0.18})`;
        c.fill();
        c.restore();

        // Main Porcelain Deck Slab (z = 0)
        drawExtrudedSlab(
          c, -hw, -hh, W, H, 0, 7, 18,
          '#FFFFFF', '#CBD5E1', '#E2E8F0', 1.4
        );

        // Draw surface content on Porcelain Deck (z = 0.5)
        c.save();
        applyPlaneTransform(c, 0.5);
        roundRectPath(c, -hw, -hh, W, H, 18);
        c.clip();

        // 1. Top Architectural Header Bar (y: -226 to -174)
        c.fillStyle = '#F8FAFC';
        c.fillRect(-hw, -hh, W, 52);
        c.strokeStyle = '#E2E8F0';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(-hw, -hh + 52);
        c.lineTo(hw, -hh + 52);
        c.stroke();

        // Precision Chronometer Emblem (Clean geometric square + pulse dot, NOT browser dots)
        roundRectPath(c, -hw + 24, -hh + 16, 20, 20, 6);
        c.fillStyle = '#F1F5F9';
        c.fill();
        c.strokeStyle = '#CBD5E1';
        c.lineWidth = 1.2;
        c.stroke();
        c.beginPath();
        c.arc(-hw + 34, -hh + 26, 3.5, 0, Math.PI * 2);
        c.fillStyle = '#0F172A';
        c.fill();

        // Brand & Module Title
        c.fillStyle = '#0F172A';
        c.font = `800 13px 'Inter', sans-serif`;
        c.textAlign = 'left';
        if ('letterSpacing' in c) c.letterSpacing = '-0.02em';
        c.fillText('ROASİST', -hw + 54, -hh + 30.5);

        c.fillStyle = '#64748B';
        c.font = `500 11.5px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0px';
        c.fillText('Çevik Sprint & Şeffaf Süreç Yönetimi', -hw + 122, -hh + 30.5);

        // Top-right status pill (Neutral Slate outline + Emerald live dot)
        roundRectPath(c, hw - 204, -hh + 13, 180, 26, 13);
        c.fillStyle = '#FFFFFF';
        c.fill();
        c.strokeStyle = '#E2E8F0';
        c.lineWidth = 1;
        c.stroke();

        c.beginPath();
        c.arc(hw - 189, -hh + 26, 3.8, 0, Math.PI * 2);
        c.fillStyle = '#10B981';
        c.fill();

        c.fillStyle = '#0F172A';
        c.font = `700 10.5px 'Inter', sans-serif`;
        c.fillText('SPRINT #04 · %100 TAKVİM', hw - 178, -hh + 29.5);

        // 2. Chronometer Timeline Subheader (y: -174 to -134)
        c.fillStyle = '#FFFFFF';
        c.fillRect(-hw, -174, W, 40);
        c.strokeStyle = '#E2E8F0';
        c.beginPath();
        c.moveTo(-hw, -134);
        c.lineTo(hw, -134);
        c.stroke();

        // Left column header
        c.fillStyle = '#64748B';
        c.font = `700 9.5px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0.06em';
        c.fillText('SÜREÇ & SPRİNT FAZI', -hw + 24, -150);

        const gridLeft = -114;
        const gridRight = 334;
        const gridW = gridRight - gridLeft; // 448
        const colW = gridW / 4; // 112

        c.strokeStyle = '#E2E8F0';
        c.beginPath();
        c.moveTo(gridLeft, -174);
        c.lineTo(gridLeft, 122);
        c.stroke();

        const weekLabels = ['01 · HAFTA 1', '02 · HAFTA 2', '03 · HAFTA 3', '04 · SÜREKLİ İVME'];
        for (let i = 0; i < 4; i++) {
          const cx = gridLeft + i * colW;
          if (i > 0) {
            c.strokeStyle = '#F1F5F9';
            c.beginPath();
            c.moveTo(cx, -174);
            c.lineTo(cx, 122);
            c.stroke();
          }

          const isReached = timelineProgress >= i * 0.23;
          c.fillStyle = isReached ? '#0F172A' : '#94A3B8';
          c.font = `700 9.5px 'Inter', sans-serif`;
          if ('letterSpacing' in c) c.letterSpacing = '0.04em';
          c.fillText(weekLabels[i], cx + 12, -150);

          // Swiss chronometer ruler ticks along y = -134
          c.strokeStyle = '#CBD5E1';
          for (let t = 0; t < 5; t++) {
            const tx = cx + (t / 5) * colW;
            const tickH = t === 0 ? 6 : 3.5;
            c.beginPath();
            c.moveTo(tx, -134 - tickH);
            c.lineTo(tx, -134);
            c.stroke();
          }
        }

        // 3. 4 Horizontal Sprint Lanes (y: -134 to +122, each row = 64px)
        const rowTopStart = -134;
        const rowH = 64;

        for (let r = 0; r < SPRINT_ROWS.length; r++) {
          const row = SPRINT_ROWS[r];
          const ry = rowTopStart + r * rowH;

          if (r % 2 === 1) {
            c.fillStyle = 'rgba(248, 250, 252, 0.65)';
            c.fillRect(-hw, ry, W, rowH);
          }

          c.strokeStyle = '#F1F5F9';
          c.beginPath();
          c.moveTo(-hw, ry + rowH);
          c.lineTo(hw, ry + rowH);
          c.stroke();

          // Left column: Clean neutral slate phase number badge (No competing dark solid blocks)
          const isRowActive = timelineProgress >= row.startT;
          roundRectPath(c, -hw + 22, ry + 15, 25, 22, 6);
          c.fillStyle = isRowActive ? '#F1F5F9' : '#F8FAFC';
          c.fill();
          c.strokeStyle = isRowActive ? '#CBD5E1' : '#E2E8F0';
          c.lineWidth = 1;
          c.stroke();

          c.fillStyle = isRowActive ? '#0F172A' : '#94A3B8';
          c.font = `700 10px 'Inter', sans-serif`;
          c.textAlign = 'center';
          if ('letterSpacing' in c) c.letterSpacing = '0px';
          c.fillText(row.num, -hw + 34.5, ry + 29.5);

          c.textAlign = 'left';
          c.fillStyle = '#0F172A';
          c.font = `700 12px 'Inter', sans-serif`;
          if ('letterSpacing' in c) c.letterSpacing = '-0.015em';
          c.fillText(row.title, -hw + 56, ry + 27);

          c.fillStyle = '#64748B';
          c.font = `500 10px 'Inter', sans-serif`;
          if ('letterSpacing' in c) c.letterSpacing = '0px';
          c.fillText(row.sub, -hw + 56, ry + 44);

          // Sleek single horizontal guide rail across the lane (instead of a duplicate grey box)
          const railY = ry + 32;
          c.strokeStyle = '#E2E8F0';
          c.lineWidth = 1.2;
          c.beginPath();
          c.moveTo(gridLeft + 12, railY);
          c.lineTo(gridRight - 12, railY);
          c.stroke();
        }

        // 4. Bottom Footer Strip on Porcelain Board (y: 122 to 226)
        c.fillStyle = '#F8FAFC';
        c.fillRect(-hw, 122, W, 104);
        c.strokeStyle = '#E2E8F0';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(-hw, 122);
        c.lineTo(hw, 122);
        c.stroke();

        c.fillStyle = '#64748B';
        c.font = `700 9.5px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0.06em';
        c.fillText('GERÇEK ZAMANLI PROJE İVMESİ & TESLİMAT HIZI', -hw + 24, 148);

        c.fillStyle = '#0F172A';
        c.font = `800 21px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '-0.025em';
        c.fillText('%99.4', -hw + 24, 178);

        c.fillStyle = '#10B981';
        c.font = `700 11px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0px';
        c.fillText('● Sıfır Gecikme · Şeffaf Raporlama', -hw + 94, 176);

        c.fillStyle = '#64748B';
        c.font = `500 10.5px 'Inter', sans-serif`;
        c.fillText('İlk günden itibaren canlı veri panelleri ve haftalık sprint çıktıları.', -hw + 24, 200);

        c.restore();

        // ============================================================================
        // 4.CHRONOMETER PLAYHEAD LINE & HEADER PILL (DRAWN BEFORE SPRINT BARS SO BARS SIT ABOVE LINE)
        // ============================================================================
        const playheadX = lerp(-96, 314, timelineProgress);

        c.save();
        applyPlaneTransform(c, 1.5);
        c.strokeStyle = 'rgba(16, 185, 129, 0.45)';
        c.lineWidth = 1.5;
        c.setLineDash([4, 3]);
        c.beginPath();
        c.moveTo(playheadX, -134);
        c.lineTo(playheadX, 122);
        c.stroke();
        c.setLineDash([]);

        c.beginPath();
        c.arc(playheadX, -134, 3.5, 0, Math.PI * 2);
        c.fillStyle = '#10B981';
        c.fill();
        c.beginPath();
        c.arc(playheadX, 122, 3.5, 0, Math.PI * 2);
        c.fillStyle = '#10B981';
        c.fill();
        c.restore();

        // ============================================================================
        // 5. ELEVATED 3D SPRINT MODULES (LIFTING IN Z-SPACE AS PLAYHEAD PASSES)
        // ============================================================================
        const rowTopStart3D = -134;
        const rowH3D = 64;

        for (let r = 0; r < SPRINT_ROWS.length; r++) {
          const row = SPRINT_ROWS[r];
          const ry = rowTopStart3D + r * rowH3D;
          const barY = ry + 11;
          const barH = 42;

          const rawFill = smoothstep(row.startT - 0.04, row.endT, timelineProgress);
          const liftWave = smoothstep(row.startT - 0.06, row.startT + 0.10, timelineProgress);
          const baseZ = (10 + r * 11) * depthLift;
          const activeZBoost = liftWave * (12 + r * 5) * depthLift;
          const zBar = Math.max(2, baseZ + activeZBoost);

          // Soft 3D Shadow cast onto the porcelain board (z = 1.2)
          if (zBar > 3) {
            c.save();
            applyPlaneTransform(c, 1.2);
            const shOffset = zBar * 0.16;
            roundRectPath(c, row.barX + shOffset * 0.5, barY + shOffset, row.barW, barH, 10);
            c.fillStyle = `rgba(15, 23, 42, ${Math.min(0.16, 0.04 + zBar * 0.002)})`;
            c.fill();
            c.restore();
          }

          // Single Primary Solid Dark CTA/Module Rule: ONLY row 4 (isPrimary) is solid #0F172A
          const topFill = row.isPrimary ? '#0F172A' : '#FFFFFF';
          const sideFill = row.isPrimary ? '#020617' : '#CBD5E1';
          const borderCol = row.isPrimary
            ? '#1E293B'
            : (rawFill > 0.1 ? '#0F172A' : '#CBD5E1');

          drawExtrudedSlab(
            c, row.barX, barY, row.barW, barH, zBar, 4.5, 10,
            topFill, sideFill, borderCol, row.isPrimary || rawFill > 0.1 ? 1.4 : 1.1
          );

          c.save();
          applyPlaneTransform(c, zBar + 0.4);
          roundRectPath(c, row.barX, barY, row.barW, barH, 10);
          c.clip();

          // Left status indicator circle (Emerald check or active pulse)
          const iconCx = row.barX + 18;
          const iconCy = barY + barH * 0.5;
          c.beginPath();
          c.arc(iconCx, iconCy, 7, 0, Math.PI * 2);
          c.fillStyle = rawFill >= 0.92
            ? '#10B981'
            : (row.isPrimary ? 'rgba(16, 185, 129, 0.20)' : '#F1F5F9');
          c.fill();

          if (rawFill >= 0.92) {
            c.strokeStyle = '#FFFFFF';
            c.lineWidth = 1.6;
            c.beginPath();
            c.moveTo(iconCx - 3, iconCy + 0.2);
            c.lineTo(iconCx - 0.6, iconCy + 2.5);
            c.lineTo(iconCx + 3.4, iconCy - 2.2);
            c.stroke();
          } else {
            c.beginPath();
            c.arc(iconCx, iconCy, 3, 0, Math.PI * 2);
            c.fillStyle = '#10B981';
            c.fill();
          }

          // Sprint Bar Label (Generous right padding so text never touches border)
          c.textAlign = 'left';
          c.fillStyle = row.isPrimary ? '#FFFFFF' : '#0F172A';
          c.font = `700 10.5px 'Inter', sans-serif`;
          if ('letterSpacing' in c) c.letterSpacing = '-0.015em';
          c.fillText(row.barLabel, row.barX + 32, barY + 17.5);

          // Bottom mini progress track + right metric
          const trackX = row.barX + 32;
          const trackY = barY + 27.5;
          const trackW = row.barW - 94;
          roundRectPath(c, trackX, trackY, trackW, 4, 2);
          c.fillStyle = row.isPrimary ? 'rgba(255, 255, 255, 0.16)' : '#E2E8F0';
          c.fill();

          roundRectPath(c, trackX, trackY, Math.max(6, trackW * Math.max(0.22, rawFill)), 4, 2);
          c.fillStyle = '#10B981';
          c.fill();

          c.textAlign = 'right';
          c.fillStyle = row.isPrimary ? '#10B981' : '#0F172A';
          c.font = `800 10px 'Inter', sans-serif`;
          c.fillText(row.metric, row.barX + row.barW - 12, barY + 31);

          c.restore();
        }

        // ============================================================================
        // 6. FLOATING 3D LIVE VELOCITY & MOMENTUM MODULE (BOTTOM-RIGHT, z = +48)
        // ============================================================================
        const cardX = 36;
        const cardY = 132;
        const cardW = 294;
        const cardH = 80;
        const zCard = 16 + 34 * depthLift;

        c.save();
        applyPlaneTransform(c, 1.5);
        roundRectPath(c, cardX + 5, cardY + 8, cardW, cardH, 12);
        c.fillStyle = `rgba(15, 23, 42, ${0.12 * depthLift + 0.04})`;
        c.fill();
        c.restore();

        drawExtrudedSlab(
          c, cardX, cardY, cardW, cardH, zCard, 4.5, 12,
          '#FFFFFF', '#CBD5E1', '#0F172A', 1.4
        );

        c.save();
        applyPlaneTransform(c, zCard + 0.5);
        roundRectPath(c, cardX, cardY, cardW, cardH, 12);
        c.clip();

        c.textAlign = 'left';
        c.fillStyle = '#64748B';
        c.font = `700 9px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0.05em';
        c.fillText('CANLI İVME HATTI (SPRINT #01 → #04)', cardX + 18, cardY + 21);

        c.fillStyle = '#0F172A';
        c.font = `800 19px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '-0.02em';
        const velocityVal = lerp(1.4, 3.8, smoothstep(0.0, 0.9, timelineProgress)).toFixed(1);
        c.fillText(`${velocityVal}x Hız`, cardX + 18, cardY + 46);

        c.fillStyle = '#10B981';
        c.font = `700 10.5px 'Inter', sans-serif`;
        if ('letterSpacing' in c) c.letterSpacing = '0px';
        c.fillText('+184% İvme Artışı', cardX + 18, cardY + 64);

        const spX = cardX + 122;
        const spY = cardY + 60;
        const spW = 154;
        const spH = 38;
        const pts = [
          [0.0, 0.15],
          [0.25, 0.34],
          [0.50, 0.54],
          [0.75, 0.78],
          [1.0, 0.98]
        ];

        c.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const px = spX + pts[i][0] * spW;
          const py = spY - pts[i][1] * spH;
          if (i === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.lineTo(spX + spW, spY + 4);
        c.lineTo(spX, spY + 4);
        c.closePath();
        c.fillStyle = 'rgba(16, 185, 129, 0.12)';
        c.fill();

        c.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const px = spX + pts[i][0] * spW;
          const py = spY - pts[i][1] * spH;
          if (i === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.strokeStyle = '#0F172A';
        c.lineWidth = 2;
        c.stroke();

        for (let i = 0; i < pts.length; i++) {
          const px = spX + pts[i][0] * spW;
          const py = spY - pts[i][1] * spH;
          const reached = timelineProgress >= pts[i][0] * 0.9;
          c.beginPath();
          c.arc(px, py, reached ? 3.5 : 2.5, 0, Math.PI * 2);
          c.fillStyle = reached ? '#10B981' : '#CBD5E1';
          c.fill();
        }
        c.restore();
      }

      // ============================================================================
      // MAIN ANIMATION LOOP (60 FPS)
      // ============================================================================
      function render(now) {
        const t = now * 0.001 + 4.2;
        const cycleDuration = 8.4;
        const cycle = (t % cycleDuration) / cycleDuration;

        const sweepIn = smoothstep(0.04, 0.84, cycle);
        const sweepOut = 1 - smoothstep(0.90, 0.99, cycle);
        const timelineProgress = lerp(0.08, 0.96, sweepIn) * sweepOut + 0.08 * (1 - sweepOut);

        const liftIn = springEase(smoothstep(0.05, 0.28, cycle));
        const liftOut = 1 - smoothstep(0.86, 0.97, cycle);
        const depthLift = Math.max(0.24, Math.min(1.08, liftIn * liftOut));

        cam.rotX = lerp(-0.18, -0.25, depthLift) + Math.sin(t * 0.7) * 0.014;
        cam.rotY = lerp(-0.14, 0.15, sweepIn * sweepOut) + Math.cos(t * 0.55) * 0.018;
        cam.rotZ = lerp(0.01, 0.03, depthLift);

        ctx.save();
        ctx.scale((width * dpr) / 1020, (height * dpr) / 788);

        drawStudioBackdrop(ctx);
        drawBaseEngineeringPlane(ctx, -36 * depthLift, depthLift);
        drawPorcelainSprintDeck(ctx, timelineProgress, depthLift);

        ctx.restore();
        requestAnimationFrame(render);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          requestAnimationFrame(render);
        });
      } else {
        requestAnimationFrame(render);
      }
    })();
  </script>
</body>
</html>
