<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Önce Veri ve Strateji — 3D Kinetik Tipografi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap&subset=latin,latin-ext" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #06050B;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* 24px Yuvarlatılmış Ana Konteyner (#0B0914) */
    .kinetic-stage {
      position: relative;
      width: min(100%, 1280px);
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 48px);
      background-color: #0B0914;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(167, 139, 250, 0.14);
      box-shadow:
        0 30px 80px -20px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      isolation: isolate;
    }

    /* Derinlik hissi için hafif radyal atmosfer ve kenar vinyeti */
    .kinetic-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.07) 0%, rgba(11, 9, 20, 0) 64%),
        radial-gradient(circle at 50% 50%, rgba(11, 9, 20, 0) 60%, rgba(11, 9, 20, 0.84) 100%);
      pointer-events: none;
      z-index: 2;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 640px) {
      html, body {
        padding: 12px;
      }
      .kinetic-stage {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <div class="kinetic-stage" id="stage">
    <canvas id="wordCloudCanvas" aria-label="Önce veri ve strateji 3D kelime bulutu animasyonu"></canvas>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('wordCloudCanvas');
      const stage = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Güncellenmiş 15 Kelimelik Liste
      const WORD_LIST = [
        'VERİ',
        'STRATEJİ',
        'ANALİZ',
        'BİRİM EKONOMİSİ',
        'BÜYÜME',
        'YOL HARİTASI',
        'PAZAR ANALİZİ',
        'RAKİP İSTİHBARATI',
        'HEDEF KİTLE',
        'KONUMLANDIRMA',
        'DÖNÜŞÜM HUNİSİ',
        'PLANLAMA',
        'TALEP ANALİZİ',
        'SEGMENTASYON',
        'KOHORT'
      ];

      // Lavanta/Mor (#A78BFA) ve parlama (glow) ile öne çıkacak anahtar kelimeler
      const HIGHLIGHT_SET = new Set([
        'VERİ',
        'STRATEJİ',
        'BİRİM EKONOMİSİ',
        'YOL HARİTASI'
      ]);

      // Renk Paleti
      const COLOR_BG = '#0B0914';
      const COLOR_HIGHLIGHT = '#A78BFA';
      const COLOR_WHITE = '#FFFFFF';
      const COLOR_SLATE = '#94A3B8';

      // 15 kelime x 3 katman = 45 düğüm, kesintisiz 3D Z-tüneli
      const CYCLES = 3;
      const TOTAL_NODES = WORD_LIST.length * CYCLES; // 45
      const LOOP_DURATION = 16.0; // Sabit hızlı kamera ilerleyişi (saniye)

      // Deterministik PRNG
      function createSeededRandom(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      let width = 1280;
      let height = 720;
      let dpr = 1;
      let nodes = [];

      // Z değerinden (1.0 = en uzak, 0.0 = kamerayı geçiş) ölçek ve 3D paralaks hesaplama
      function getScaleAtZ(z, sizeMultiplier) {
        const approach = 1 - z;
        const perspectiveCurve = 0.24 + 1.18 * Math.pow(approach, 2.05);
        return perspectiveCurve * sizeMultiplier;
      }

      function getParallaxAtZ(z) {
        const approach = 1 - z;
        return 0.72 + 0.36 * Math.pow(approach, 1.35);
      }

      // Üst üste binmeyi (overlap) önleyen 3D X-Y-Z kutu ayrıştırma algoritması
      function buildSceneNodes() {
        const rand = createSeededRandom(20261128);
        const placed = [];
        const zStep = 1.0 / TOTAL_NODES;
        const REF_BASE_FONT = 38;

        const sequence = [];
        for (let c = 0; c < CYCLES; c++) {
          const cycleWords = [...WORD_LIST];
          for (let i = cycleWords.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const tmp = cycleWords[i];
            cycleWords[i] = cycleWords[j];
            cycleWords[j] = tmp;
          }
          sequence.push(...cycleWords);
        }

        const ROWS = 9;
        const COLS = 3;
        const TOTAL_SLOTS = ROWS * COLS;

        for (let i = 0; i < TOTAL_NODES; i++) {
          const text = sequence[i];
          const isHighlight = HIGHLIGHT_SET.has(text);
          const zBase = i * zStep;
          const sizeMultiplier = isHighlight ? 1.15 : (i % 3 === 0 ? 1.02 : 0.90);

          const peakScale = getScaleAtZ(0.18, sizeMultiplier);
          const peakFontSize = REF_BASE_FONT * peakScale;
          const peakHalfW = (text.length * peakFontSize * 0.34) + 22;
          const peakHalfH = (peakFontSize * 0.65) + 16;

          const maxSafeX = Math.max(130, 585 - peakHalfW);
          const maxSafeY = Math.max(80, 312 - peakHalfH);

          let bestX = 0;
          let bestY = 0;
          let bestScore = -Infinity;

          const candidateCount = 60;
          for (let attempt = 0; attempt < candidateCount; attempt++) {
            const slotIdx = (i * 13 + attempt * 5) % TOTAL_SLOTS;
            const row = slotIdx % ROWS;
            const col = Math.floor(slotIdx / ROWS);

            const rowOffset = (row % 2 === 0) ? -0.14 : 0.14;
            const baseNormX = ((col + 0.5) / COLS) * 2 - 1 + rowOffset + (rand() - 0.5) * 0.36;
            const baseNormY = ((row + 0.5) / ROWS) * 2 - 1 + (rand() - 0.5) * 0.22;

            const candX = Math.max(-maxSafeX, Math.min(maxSafeX, baseNormX * maxSafeX));
            const candY = Math.max(-maxSafeY, Math.min(maxSafeY, baseNormY * maxSafeY));

            let minClearance = Infinity;

            for (let j = 0; j < placed.length; j++) {
              const other = placed[j];
              let rawDz = zBase - other.zBase;
              if (rawDz > 0.5) rawDz -= 1.0;
              if (rawDz < -0.5) rawDz += 1.0;
              const absDz = Math.abs(rawDz);

              if (absDz < 0.52) {
                const testZs = [0.20, 0.36, 0.54, 0.72];
                for (let k = 0; k < testZs.length; k++) {
                  const z1 = testZs[k];
                  const z2 = z1 - rawDz;
                  if (z2 < 0.06 || z2 > 0.92) continue;

                  const p1 = getParallaxAtZ(z1);
                  const p2 = getParallaxAtZ(z2);
                  const sc1 = getScaleAtZ(z1, sizeMultiplier);
                  const sc2 = getScaleAtZ(z2, other.sizeMultiplier);

                  const sx1 = candX * p1;
                  const sy1 = candY * p1;
                  const sx2 = other.x * p2;
                  const sy2 = other.y * p2;

                  const w1 = (text.length * REF_BASE_FONT * sc1 * 0.35) + 20;
                  const h1 = (REF_BASE_FONT * sc1 * 0.72) + 16;
                  const w2 = (other.text.length * REF_BASE_FONT * sc2 * 0.35) + 20;
                  const h2 = (REF_BASE_FONT * sc2 * 0.72) + 16;

                  const dxNorm = Math.abs(sx1 - sx2) / (w1 + w2);
                  const dyNorm = Math.abs(sy1 - sy2) / (h1 + h2);

                  const boxClearance = Math.max(dxNorm * 0.92, dyNorm * 1.08);
                  const depthWeight = 0.72 + 0.28 * (absDz / 0.52);
                  const score = boxClearance * depthWeight;

                  if (score < minClearance) {
                    minClearance = score;
                  }
                }
              }
            }

            if (placed.length === 0) {
              minClearance = 10;
            }

            if (minClearance > bestScore) {
              bestScore = minClearance;
              bestX = candX;
              bestY = candY;
            }
          }

          let color = COLOR_WHITE;
          if (isHighlight) {
            color = COLOR_HIGHLIGHT;
          } else {
            color = (i % 2 === 0) ? COLOR_WHITE : COLOR_SLATE;
          }

          placed.push({
            text,
            isHighlight,
            color,
            x: bestX,
            y: bestY,
            zBase,
            sizeMultiplier
          });
        }

        nodes = placed;
      }

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(320, Math.floor(rect.width));
        height = Math.max(200, Math.floor(rect.height));
        canvas.width = width * dpr;
        canvas.height = height * dpr;
      }

      // Opaklık eğrisi:
      // Uzakta düşük opaklık (0.15), kameraya yaklaştıkça büyüyüp netleşir (1.0),
      // kamerayı geçerken yumuşakça kaybolur (0.0).
      function computeOpacity(z) {
        if (z > 0.92) {
          const t = Math.max(0, Math.min(1, (1.0 - z) / 0.08));
          return 0.15 * (t * t * (3 - 2 * t));
        }
        if (z > 0.66) {
          const t = (0.92 - z) / (0.92 - 0.66);
          return 0.15 + 0.10 * t;
        }
        if (z > 0.26) {
          const t = (0.66 - z) / (0.66 - 0.26);
          const smooth = t * t * (3 - 2 * t);
          return 0.25 + 0.75 * smooth;
        }
        if (z > 0.13) {
          return 1.0;
        }
        const t = Math.max(0, Math.min(1, z / 0.13));
        return t * t * (3 - 2 * t);
      }

      buildSceneNodes();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas, { passive: true });

      const renderList = new Array(TOTAL_NODES);
      let startTime = performance.now();

      function renderFrame(now) {
        const elapsedSeconds = (now - startTime) * 0.001;
        const cameraProgress = (elapsedSeconds / LOOP_DURATION) % 1.0;

        ctx.save();
        ctx.scale(dpr, dpr);

        ctx.fillStyle = COLOR_BG;
        ctx.fillRect(0, 0, width, height);

        const centerX = width * 0.5;
        const centerY = height * 0.5;
        const viewportScale = Math.min(width / 1280, height / 720);
        const refBaseFont = 38 * viewportScale;

        for (let i = 0; i < TOTAL_NODES; i++) {
          const node = nodes[i];
          let z = (node.zBase - cameraProgress) % 1.0;
          if (z < 0) z += 1.0;
          renderList[i] = { node, z };
        }

        // Arkadan öne sıralama (Painter's Algorithm)
        renderList.sort((a, b) => b.z - a.z);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < TOTAL_NODES; i++) {
          const { node, z } = renderList[i];
          const alpha = computeOpacity(z);
          if (alpha <= 0.005) continue;

          const scale = getScaleAtZ(z, node.sizeMultiplier);
          const parallax = getParallaxAtZ(z);

          const screenX = centerX + node.x * parallax * viewportScale;
          const screenY = centerY + node.y * parallax * viewportScale;
          const fontSize = refBaseFont * scale;

          ctx.save();
          ctx.font = `800 ${fontSize.toFixed(2)}px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif`;
          if ('letterSpacing' in ctx) {
            ctx.letterSpacing = `${(-0.03 * fontSize).toFixed(2)}px`;
          }

          ctx.globalAlpha = alpha;
          ctx.fillStyle = node.color;

          if (node.isHighlight) {
            ctx.shadowColor = 'rgba(167, 139, 250, 0.72)';
            ctx.shadowBlur = Math.min(26, Math.max(4, 15 * scale * viewportScale));
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.fillText(node.text, screenX, screenY);
          ctx.restore();
        }

        ctx.restore();
        requestAnimationFrame(renderFrame);
      }

      requestAnimationFrame(renderFrame);
    })();
  </script>
</body>
</html>
